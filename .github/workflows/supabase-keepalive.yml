name: Keep Supabase awake

# Free Supabase projects pause after 7 days of no activity. This pings the DB
# every ~3 days so the inactivity timer never runs out. A single authenticated
# query counts as activity.

on:
  schedule:
    - cron: "0 6 */5 * *" # every ~5 days at 06:00 UTC (under the 7-day window)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to reset the inactivity timer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/chat_logs?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase responded: $code"
          if [ "$code" != "200" ]; then
            echo "Unexpected status $code (expected 200)" >&2
            exit 1
          fi
